name: FastAPI CI Matrix

on:
  push:
  pull_request:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/calculator

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
#-----------------Login Dockerhub and Build Image---------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}   #create_Personal_access_token_from_dockerhub

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/calculator:latest
            ${{ secrets.DOCKER_USERNAME }}/calculator:${{ github.sha }}

 # ── Job 3: Deploy ────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-push              # only if build-push passes
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop myapp || true
            docker rm   myapp || true
            docker run -d \
              --name myapp \
              --restart unless-stopped \
              -p 8000:8000 \
              ${{ env.IMAGE_NAME }}:latest
            echo 'Deployed:' $(date)
